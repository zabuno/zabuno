name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-lint-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: zabuno
          POSTGRES_PASSWORD: zabuno
          POSTGRES_DB: zabuno_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
          extensions: pdo_pgsql, pgsql
          # Burada bir sure `ini-values: memory_limit=512M` durdu; kaldirildi.
          # QrExportPdfTest'in aralikli 500'une karsi kanitlanmamis bir
          # sigortaydi ve ise yaramadigi kayitlidir: test iki kez ayni sekilde
          # kirildi -- run 32917446564 (7cb7938, satir henuz YOKKEN) ve run
          # 32979223816 (597fe22, satiri EKLEYEN commit'in kendi kosusu, yani
          # 512M zaten yururlukteyken). Ikisinde de 16 kagit/yon
          # kombinasyonundan tam olarak biri "500 is identical to 200" ile
          # dustu, kalan 15'i ayni bellek tavaninda gecti -- yani sinyal
          # kaynak baskisi degil, payload basina bir hataydi.
          #
          # Ustelik satir bellegi ARTIRMIYOR, AZALTIYORDU: runner'in varsayilan
          # degeri olculdu ve `memory_limit=-1` (sinirsiz) cikti (run
          # 33010438701). Tek etkisi tavani sinirsizdan 512M'ye cekmekti.
          #
          # Sebep 2026-08-26'da kanitlandi ve bellek degildi (bkz. #69). Kanonik
          # aciklama ve regresyon:
          # app/Infrastructure/QrDestination/Rendering/
          # EndroidQrCodeImageExportAdapter.php ve
          # tests/Feature/QrDestination/QrExportDecodeBackTest.php.
          #
          # Not (yerel gelistirme, CI'yi ilgilendirmez): suite'in gercek tepe
          # kullanimi 120M ile 128M arasinda -- 120M'de fatal, 128M'de gecer
          # (bisect, 2026-08-26); en agir tuketici QR decode-back yolu. PHP CLI
          # varsayilani 128M olan bir makinede pay dardir. CI'da limit sinirsiz
          # oldugu icin bu bir CI sorunu degildir.
          #
          # Ayni test tekrar kirilirsa cevap yine bellek degildir.

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Validate composer.json and composer.lock
        run: composer validate

      - name: Install PHP dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Install Node dependencies
        run: npm ci

      - name: Copy local environment file
        run: cp .env.example .env

      - name: Generate application key
        run: php artisan key:generate

      - name: PHP formatting check (Pint)
        run: vendor/bin/pint --test

      - name: JS/TS lint and typecheck
        run: npm run lint

      - name: JS/TS formatting check (Prettier)
        run: npm run format

      - name: S1-WP01A foundation preflight
        run: php tests/preflight/s1-wp01a-foundation-preflight.php

      - name: Translation projections are in sync with the PO catalogs
        run: npm run i18n:check

      - name: Build frontend assets
        run: npm run build

      # Adaptive ayrım okuyarak doğrulanamaz: cihaza özgü bir bileşen,
      # paylaşılan bir dosyadaki tek bir import satırıyla diğer pakete sızar ve
      # ekranda görünmediği için fark edilmez (docs/54, docs/60).
      - name: Device bundles stay separate
        run: ./scripts/adaptive-bundle-gate

      - name: Adaptive bundle gate self-test
        run: ./scripts/adaptive-bundle-gate.test.sh

      # Kabuk duzeni jsdom'da OLCULEMEZ: jsdom duzen hesaplamaz, her kutu
      # sifir yuksekliktedir ve hicbir sey kaydirilmaz. Kabuk uc kez ust uste
      # sahibin ekraninda kirildi ve her seferinde butun testler yesildi.
      # Bu adim gercek Chrome'da olcer: kabuk gorunen alan boyunda mi, belge
      # kayiyor mu, ana alan kaydirilabiliyor mu, alt cubuk dipte mi.
      - name: Shell scroll gate (real browser)
        run: node scripts/shell-scroll-gate "file://$PWD/$(ls public/build/assets/app-*.css | head -1)"

      # 320 pikselde ne olduğu bu depoda hic olculmuyordu: jsdom duzen
      # hesaplamaz, yani "mobilde calisiyor mu" sorusu hic sorulamiyordu
      # (docs/117). Bu adim gercek Chrome'da her hikayeyi 320x568'de olcuyor.
      #
      # Mevcut borc DONDURULMUS (scripts/mobile-ux-audit.baseline.json): kapi
      # yalniz listede OLMAYAN bir ihlalde kirilir. Listedeki bir hikaye
      # duzelirse de kirilir ve liste guncellenmeye zorlanir -- aksi halde
      # liste eskir ve coktan duzelmis ekranlari korumaya devam eder.
      - name: Mobile UX audit (320px, real browser)
        run: |
          npm run build-storybook -- --quiet -o storybook-static
          node scripts/mobile-ux-audit storybook-static --baseline scripts/mobile-ux-audit.baseline.json

      # Ayni suit, urun motorunda. SQLite ile PostgreSQL sessizce farkli
      # davraniyor ve fark her seferinde SQLite lehine hata gizliyordu:
      # basarisiz bir INSERT PostgreSQL'de tum islemi iptal eder, SQLite'ta
      # etmez; SQLSTATE kodlari ayridir (23000 / 23505); timestamp'i her motor
      # kendi bicimiyle geri verir -- ki bu, kanit kayitlarinin butunluk
      # ozetini gecersiz kiliyordu. 2026-08-27'de bu farklar 18 teste mal
      # oldu ve hicbiri SQLite'ta gorunmuyordu. Bir daha gorunmezlesmesin.
      - name: Laravel test suite (PostgreSQL, deployment target)
        env:
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_DATABASE: zabuno_ci
          DB_USERNAME: zabuno
          DB_PASSWORD: zabuno
        run: ./vendor/bin/phpunit

      - name: Laravel test suite
        run: php artisan test

      - name: Vitest suite
        run: npm test

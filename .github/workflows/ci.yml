name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-lint-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
          # CI 2026-08-26'da QrExportPdfTest'te bir kez 500 verip kirildi ve
          # ayni commit yeniden calistirilinca gecti. O gun sebep KANITLANMAMIS,
          # bellek yalnizca makul bir suphe olarak buraya yazilmisti.
          #
          # SEBEP ARTIK KANITLANDI VE BELLEK DEGILDI. QR disa aktarici, urettigi
          # QR'i teslim etmeden once gercek decoder ile geri okuyordu; bu geri
          # okuma try-harder ipucu olmadan calisiyordu ve o modda Zxing, finder
          # pattern ararken goruntunun yalnizca her 6. satirini tariyor
          # (FinderPatternFinder::find(), iSkip = 3*yukseklik / (4*57)). Bazi
          # payload'larda desenler iki taranan satirin arasina dustugu icin
          # gecerli bir QR "okunamaz" sayiliyor; dort aday profilin dordu birden
          # kacirdiginda export RuntimeException atiyor ve controller bunu 500'e
          # ceviriyordu. Hangi payload'in kotu dustugunu payload'in kendisi
          # belirler -- ayni token her seferinde kirilir -- ama tokenlar QR
          # basina rastgele uretildigi icin kosudan kosuya rastlantisal gorunur.
          # Makine yuku ile ilgisi yoktur.
          #
          # Olcum (2026-08-26, CI'daki APP_URL bicimiyle, 16.000 rastgele token,
          # duzeltme oncesi kod): ilk profilde %7.3 kacirma, dort profilde
          # birden 8/16.000 = 1/2000. Duzeltme oncesi tam suite kosusu 45 farkli
          # rastgele payload render ediyordu ve bunun 25'i QrExportPdfTest'e
          # aitti; yani kosu basina ~%2.2 kirilma ihtimali, ve en cok maruz
          # kalan tek test QrExportPdfTest. Ayni olcum duzeltilmis kodla:
          # 16.000 tokenda 0 hata.
          #
          # Duzeltme: app/Infrastructure/QrDestination/Rendering/
          # EndroidQrCodeImageExportAdapter.php (geri okuma artik try-harder
          # ipucu ile, ayni tam-esitlik sartiyla yapiliyor). Regresyon:
          # tests/Feature/QrDestination/QrExportDecodeBackTest.php -- o hatayi
          # gercekten ureten, dondurulmus token'lar.
          #
          # Asagidaki satir bu teshisin parcasi degildi ve artik bir hipotez de
          # tasimiyor. Suite yerelde ~105 MB tepe kullanimla kosuyor; satir
          # yalnizca bos pay olarak birakildi, bir duzeltme olarak degil.
          ini-values: memory_limit=512M

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Validate composer.json and composer.lock
        run: composer validate

      - name: Install PHP dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Install Node dependencies
        run: npm ci

      - name: Copy local environment file
        run: cp .env.example .env

      - name: Generate application key
        run: php artisan key:generate

      - name: PHP formatting check (Pint)
        run: vendor/bin/pint --test

      - name: JS/TS lint and typecheck
        run: npm run lint

      - name: JS/TS formatting check (Prettier)
        run: npm run format

      - name: S1-WP01A foundation preflight
        run: php tests/preflight/s1-wp01a-foundation-preflight.php

      - name: Translation projections are in sync with the PO catalogs
        run: npm run i18n:check

      - name: Build frontend assets
        run: npm run build

      - name: Laravel test suite
        run: php artisan test

      - name: Vitest suite
        run: npm test

name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-lint-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: zabuno
          POSTGRES_PASSWORD: zabuno
          POSTGRES_DB: zabuno_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
          extensions: pdo_pgsql, pgsql
          # Burada bir sure `ini-values: memory_limit=512M` durdu; kaldirildi.
          # QrExportPdfTest'in aralikli 500'une karsi kanitlanmamis bir
          # sigortaydi ve ise yaramadigi kayitlidir: test iki kez ayni sekilde
          # kirildi -- run 32917446564 (7cb7938, satir henuz YOKKEN) ve run
          # 32979223816 (597fe22, satiri EKLEYEN commit'in kendi kosusu, yani
          # 512M zaten yururlukteyken). Ikisinde de 16 kagit/yon
          # kombinasyonundan tam olarak biri "500 is identical to 200" ile
          # dustu, kalan 15'i ayni bellek tavaninda gecti -- yani sinyal
          # kaynak baskisi degil, payload basina bir hataydi.
          #
          # Ustelik satir bellegi ARTIRMIYOR, AZALTIYORDU: runner'in varsayilan
          # degeri olculdu ve `memory_limit=-1` (sinirsiz) cikti (run
          # 33010438701). Tek etkisi tavani sinirsizdan 512M'ye cekmekti.
          #
          # Sebep 2026-08-26'da kanitlandi ve bellek degildi (bkz. #69). Kanonik
          # aciklama ve regresyon:
          # app/Infrastructure/QrDestination/Rendering/
          # EndroidQrCodeImageExportAdapter.php ve
          # tests/Feature/QrDestination/QrExportDecodeBackTest.php.
          #
          # Not (yerel gelistirme, CI'yi ilgilendirmez): suite'in gercek tepe
          # kullanimi 120M ile 128M arasinda -- 120M'de fatal, 128M'de gecer
          # (bisect, 2026-08-26); en agir tuketici QR decode-back yolu. PHP CLI
          # varsayilani 128M olan bir makinede pay dardir. CI'da limit sinirsiz
          # oldugu icin bu bir CI sorunu degildir.
          #
          # Ayni test tekrar kirilirsa cevap yine bellek degildir.

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Validate composer.json and composer.lock
        run: composer validate

      - name: Install PHP dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Install Node dependencies
        run: npm ci

      - name: Copy local environment file
        run: cp .env.example .env

      - name: Generate application key
        run: php artisan key:generate

      - name: PHP formatting check (Pint)
        run: vendor/bin/pint --test

      - name: JS/TS lint and typecheck
        run: npm run lint

      - name: JS/TS formatting check (Prettier)
        run: npm run format

      - name: S1-WP01A foundation preflight
        run: php tests/preflight/s1-wp01a-foundation-preflight.php

      - name: Translation projections are in sync with the PO catalogs
        run: npm run i18n:check

      - name: Build frontend assets
        run: npm run build

      # Adaptive ayrım okuyarak doğrulanamaz: cihaza özgü bir bileşen,
      # paylaşılan bir dosyadaki tek bir import satırıyla diğer pakete sızar ve
      # ekranda görünmediği için fark edilmez (docs/54, docs/60).
      - name: Device bundles stay separate
        run: ./scripts/adaptive-bundle-gate

      - name: Adaptive bundle gate self-test
        run: ./scripts/adaptive-bundle-gate.test.sh

      # Dokuz dilin IKISI sagdan sola yazilir (ar, fa). Fiziksel yon tasiyan
      # her CSS kurali o iki dilde TERS calisir ve bu, Arapca bir ceviri
      # geldigi gun degil, o gunden aylar once yazilmis kodda olur
      # (docs/121 O10). Bu kapi kaynagi tarar: yeni bir fiziksel yon
      # ozelligi eklendiginde kirilir. Bugunku gerekceli istisnalar
      # scripts/logical-direction-gate.baseline.json icinde ve gerekcesiz
      # bir istisna da kapiyi kirar.
      - name: Logical direction gate (docs/121 Ö10)
        run: node scripts/logical-direction-gate

      - name: Logical direction gate self-test
        run: ./scripts/logical-direction-gate.test.sh

      # Kabuk duzeni jsdom'da OLCULEMEZ: jsdom duzen hesaplamaz, her kutu
      # sifir yuksekliktedir ve hicbir sey kaydirilmaz. Kabuk uc kez ust uste
      # sahibin ekraninda kirildi ve her seferinde butun testler yesildi.
      # Bu adim gercek Chrome'da olcer: kabuk gorunen alan boyunda mi, belge
      # kayiyor mu, ana alan kaydirilabiliyor mu, alt cubuk dipte mi.
      - name: Shell browser startup self-test
        run: node --test scripts/shell-scroll-startup.test.mjs

      - name: Shell scroll gate (real browser)
        run: node scripts/shell-scroll-gate "file://$PWD/$(ls public/build/assets/app-*.css | head -1)"

      # 320 pikselde ne olduğu bu depoda hic olculmuyordu: jsdom duzen
      # hesaplamaz, yani "mobilde calisiyor mu" sorusu hic sorulamiyordu
      # (docs/117). Bu adim gercek Chrome'da her hikayeyi 320x568'de olcuyor.
      #
      # Mevcut borc DONDURULMUS (scripts/mobile-ux-audit.baseline.json): kapi
      # yalniz listede OLMAYAN bir ihlalde kirilir. Listedeki bir hikaye
      # duzelirse de kirilir ve liste guncellenmeye zorlanir -- aksi halde
      # liste eskir ve coktan duzelmis ekranlari korumaya devam eder.
      - name: Mobile UX audit (320px, real browser)
        run: |
          npm run build-storybook -- --quiet -o storybook-static
          node scripts/mobile-ux-audit storybook-static --baseline scripts/mobile-ux-audit.baseline.json

      # SAGDAN SOLA, GERCEK BIR DUZEN MOTORUNDA (docs/121 §4, docs/120 §7).
      # Sahte-yerellestirme RTL'i OLCMEZ: uzayan metnin kirdigini gosterir,
      # ters akan bir duzenin kirdigini degil. Bu adim ayni 331 hikayeyi
      # 320 pikselde ve dir=rtl ile yeniden olcuyor; hicbir metin
      # cevrilmez, yalniz yon cevrilir. Kendi dondurulmus borc listesi var.
      - name: Mobile UX audit — right-to-left (320px, real browser)
        run: node scripts/mobile-ux-audit storybook-static --direction rtl --baseline scripts/mobile-ux-audit.rtl.baseline.json

      # ═══ SAHNE KAPILARI (docs/146 §12) ═══════════════════════════════════
      #
      # Uc dongudur yazilan sahne motoru bugune kadar CI'da HIC kosmadi ve
      # bunun bedeli olculdu: gorsel kapinin tabani, main'e girdigi gunden
      # beri KIRMIZIYDI. Iki paket ayni gun birlestirildi (#328 ust cubuga
      # vurgulu bir /register dugmesi koydu, #332 gorsel tabani yazdi) ve
      # ikisinin birlesimi hicbir yerde olculmedi. Tek bir hucre grubunda
      # 66/255 sapma vardi -- ust cubuktaki o dugmenin tam yeri.
      #
      # Kosulmayan bir kapi yoktur. Uc kapi da buradan itibaren her PR'da
      # kosuyor.

      - name: Scene weight budget (SITE-SCENE-BUDGET-01)
        run: node scripts/scene-budget-gate --fail

      # Sahne kapilarinin ikisi gercek bir sayfa ISTER: sunucuda uretilen
      # HTML, derlenmis CSS ve calisan motor. `php artisan serve` tek is
      # parcacikli bir gelistirme sunucusudur ve YAVASTIR -- kapilar bunu
      # biliyor: olculen sey sunucunun yanit suresi degil, sahnenin kendi
      # payi (bkz. scene-perf-gate icindeki `sceneDelayMs` gerekcesi).
      #
      # Fiyat sayfasi plan tablosunu okur: bos sema, fiyat kartlari yerine
      # bos durum cizer. Yerel gorsel olcum de yeni bir SQLite veritabani
      # ve yalniz bu kanonik katalogla yapilir; local-dev plani kullanilmaz.
      - name: Serve the corporate site for the scene gates
        run: |
          touch database/database.sqlite
          php artisan migrate --force --no-interaction
          php artisan db:seed --class=PlanCatalogueSeeder --force --no-interaction
          nohup php artisan serve --port=8291 --no-reload --silent > /tmp/zabuno-serve.log 2>&1 &
          disown || true
          for attempt in $(seq 1 60); do
            if curl -sf -o /dev/null http://127.0.0.1:8291/; then
              echo "sunucu hazir (deneme $attempt)"
              exit 0
            fi
            sleep 1
          done
          echo "sunucu 60 saniyede acilmadi -- OLCUM YAPILMADI"
          exit 1

      # DURAGANLIK + GERILEME, boyanan pikselle. Tolerans 12/255 ve olculdu:
      # macOS Chrome ile Debian Chromium arasindaki en kotu hucre farki 7,
      # gercek bir gerileme ise 36-80 (docs/146 §12).
      - name: Scene visual gate (SAHNE-GORSEL-01, real browser)
        run: |
          mkdir -p storage/app/scene-visual
          node scripts/scene-visual-gate --base http://127.0.0.1:8291 --fail --png storage/app/scene-visual > storage/app/scene-visual/report.json

      - name: Preserve scene visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scene-visual-${{ github.run_id }}-${{ github.run_attempt }}
          path: storage/app/scene-visual
          if-no-files-found: ignore
          retention-days: 7

      # KARE SURESI ve ILK EKRAN. 320x480 taban; CPU dortte bire kisilmis.
      - name: Scene frame budget (320x480, real browser)
        run: |
          mkdir -p storage/app/scene-perf
          node scripts/scene-perf-gate --url http://127.0.0.1:8291/ --width 320 --height 480 --cpu 4 --fail --json storage/app/scene-perf/baseline.json --diagnostics storage/app/scene-perf

      - name: Preserve scene performance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scene-perf-${{ github.run_id }}-${{ github.run_attempt }}
          path: storage/app/scene-perf
          if-no-files-found: ignore
          retention-days: 7

      # MERDIVEN GERCEKTEN INIYOR MU: iki cekirdekli bir cihazda tuval
      # boyanmamali. Bu, kapinin en onemli iddiasi -- "yavas cihazda yavas"
      # bir kusur degil, "yavas cihazda hala tam yuk" bir kusurdur.
      - name: Scene tier ladder (2 cores, real browser)
        run: node scripts/scene-perf-gate --url http://127.0.0.1:8291/ --width 320 --height 480 --cpu 4 --concurrency 2 --expect-tier minimal --fail

      # Yedek tatbikati (docs/124) gercek pg_dump/pg_restore ile OLCULUR.
      # Runner imajinin kendi istemcisi sunucudan (postgres:17) eski
      # olabilir ve pg_dump daha yeni bir sunucuyu REDDEDER ("server version
      # mismatch"). Kosucu bunu "unknown" olarak kaydeder, "gecti" demez;
      # ama CI'da bilinmiyor yeterli degil: istemci sunucuyla ayni majore
      # cekilir ve PostgresBackupRestoreDrillTest CI=true iken eksik araci
      # skip degil FAIL sayar. PGDG deposu runner'da zaten olabilir; ikinci
      # kez eklemek yalniz bir uyari verir.
      - name: PostgreSQL 17 client (pg_dump/pg_restore for the backup drill)
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/zabuno-pgdg.list
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends postgresql-client-17
          # /usr/bin/pg_dump, postgresql-common'in sarmalayicisidir ve runner
          # imajindaki 16 istemcisini secmeye devam eder (olculdu: paket 17
          # kuruldu, `pg_dump --version` yine 16.15 dedi ve tatbikat "unknown"
          # kaldi). Surumlu dizin PATH'in basina alinir ve 17 oldugu dogrulanir.
          echo "/usr/lib/postgresql/17/bin" >> "$GITHUB_PATH"
          /usr/lib/postgresql/17/bin/pg_dump --version | grep -E '\) 17\.' 
          /usr/lib/postgresql/17/bin/pg_restore --version | grep -E '\) 17\.'

      # Ayni suit, urun motorunda. SQLite ile PostgreSQL sessizce farkli
      # davraniyor ve fark her seferinde SQLite lehine hata gizliyordu:
      # basarisiz bir INSERT PostgreSQL'de tum islemi iptal eder, SQLite'ta
      # etmez; SQLSTATE kodlari ayridir (23000 / 23505); timestamp'i her motor
      # kendi bicimiyle geri verir -- ki bu, kanit kayitlarinin butunluk
      # ozetini gecersiz kiliyordu. 2026-08-27'de bu farklar 18 teste mal
      # oldu ve hicbiri SQLite'ta gorunmuyordu. Bir daha gorunmezlesmesin.
      - name: Laravel test suite (PostgreSQL, deployment target)
        env:
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_DATABASE: zabuno_ci
          DB_USERNAME: zabuno
          DB_PASSWORD: zabuno
        run: ./vendor/bin/phpunit

      - name: Laravel test suite
        run: php artisan test

      - name: Vitest suite
        run: npm test

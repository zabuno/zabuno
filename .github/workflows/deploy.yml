name: Deploy

# CI YEŞİL OLUNCA OTOMATİK. Sahibi `main`'e birleştirdiğinde site kendini
# günceller; kimseye haber vermek gerekmez.
#
# Tetikleyici `push` DEĞİL, `workflow_run`: doğrudan push'a bağlansaydı
# deploy testlerle YARIŞIRDI ve kırık bir sürüm yayına çıkabilirdi. Bu
# biçimde deploy, CI'ın bittiğini ve GEÇTİĞİNİ bekler.
#
# Elle tetikleme de duruyor: geri alma ve yeniden deneme için gerekir.
on:
  workflow_run:
    workflows: ['CI']
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      confirm:
        description: "Elle deploy için DEPLOY yazın (otomatik deploy'da gerekmez)"
        required: false
        default: ''

# Registry'ye yazma yetkisi YOK ve gerekmiyor: imaj GHCR'a itilmez, var
# olan SSH kanalindan sunucuya aktarilir (bkz. `docs/42`).
permissions:
  contents: read

concurrency:
  # Aynı anda iki deploy, sunucuda yarış demektir.
  group: deploy-production
  cancel-in-progress: false

jobs:
  guard:
    runs-on: ubuntu-latest
    outputs:
      should_deploy: ${{ steps.decide.outputs.should_deploy }}
    steps:
      - name: Sunucu tanımlı mı?
        id: server
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          # Sunucu henüz kurulmadıysa deploy BAŞARISIZ OLMAZ, ATLANIR.
          # Her birleşmede kırmızı bir X görmek "kırmızıyı görmezden gel"
          # alışkanlığı yaratır, ve o alışkanlık gerçek arızaları da gizler.
          #
          # Ama ATLAMA SESSİZ KALAMAZ. Bu iş yeşil biter ve sahip yeşili
          # "birleştirdiğim şey yayında" diye okur — oysa hiçbir şey
          # koşmamıştır: ne göçler, ne sayfa kütüğü, ne de yayın kararları.
          # Atlanan iş ADIYLA söylenir ve koşum özetine yazılır; bir
          # `::notice::`, günlüğün içinde kaybolabilir.
          if [ -z "${DEPLOY_HOST}" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::warning::ADIM ATLANDI — sunucu secret'ları tanımlı değil. Yayın kararları (site:apply-publication-decisions) UYGULANMADI; canlıda hiçbir şey değişmedi. Kurulum: docs/43."
            {
              echo "### ADIM ATLANDI — dağıtım koşmadı"
              echo
              echo "Sunucu secret'ları (\`DEPLOY_HOST\`) tanımlı değil, bu yüzden **hiçbir şey yayına alınmadı**."
              echo
              echo "Koşmayan adımlar:"
              echo
              echo "- \`php artisan migrate --force\` — göçler"
              echo "- \`php artisan site:import-map\` — sayfa kütüğü"
              echo "- \`php artisan site:apply-publication-decisions\` — yayın kararları"
              echo
              echo "Bu koşumun yeşil olması, sitenin güncellendiği anlamına **gelmez**. Kurulum: \`docs/43\`."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy edilmeli mi?
        id: decide
        run: |
          # Karar sırası önemli. "Atlama" ile "başarısızlık" ayrı şeylerdir:
          # atlama, yapacak bir iş olmadığını söyler; başarısızlık, birinin
          # bakması gerektiğini. İkisini karıştırmak, kırmızıyı anlamsız
          # kılar.

          # 1. Sunucu yok → yapacak iş yok.
          if [ "${{ steps.server.outputs.configured }}" != "true" ]; then
            echo "should_deploy=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # 2. CI geçmedi → CI bunu zaten bildirdi. İkinci bir kırmızı X
          #    bilgi eklemez, yalnız gürültü olur.
          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            if [ "${{ github.event.workflow_run.conclusion }}" != "success" ]; then
              echo "::notice::CI geçmedi (${{ github.event.workflow_run.conclusion }}); deploy atlandı."
              echo "should_deploy=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi

            echo "should_deploy=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # 3. Elle tetiklemede onay yoksa → bu bir kullanıcı hatası ve
          #    görünmesi gerekir.
          if [ "${{ inputs.confirm }}" != "DEPLOY" ]; then
            echo "Elle deploy için onay kutusuna DEPLOY yazın."
            exit 1
          fi

          echo "should_deploy=true" >> "$GITHUB_OUTPUT"

  deploy:
    needs: guard
    if: needs.guard.outputs.should_deploy == 'true'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: İmaj etiketini hesapla
        id: meta
        run: |
          # `workflow_run` bağlamında GITHUB_SHA varsayılan dalın ucudur;
          # deploy edilmesi gereken, CI'ın GEÇTİĞİ commit'tir.
          sha="${{ github.event.workflow_run.head_sha || github.sha }}"
          echo "sha=${sha}" >> "$GITHUB_OUTPUT"
          # Etiket yerel: registry adı YOK. İmaj bir kayıt defterine
          # uğramadan, doğrudan sunucuya gider.
          echo "image=zabuno:${sha}" >> "$GITHUB_OUTPUT"

      # Hedef netcup AMD EPYC: linux/amd64. Runner zaten amd64 olduğu için
      # emülasyon yok; platform yine de AÇIKÇA yazılıyor, çünkü runner
      # mimarisinin sessizce değişmesi imajı hedefte çalışmaz hâle getirir.
      #
      # `push: false` ve çıktı bir DOSYA: imaj GHCR'a itilmiyor. Sebep
      # maliyet ve yüzey. Private bir paketin depolaması ve sunucunun her
      # çekimi kotaya yazılır; dahası sunucuda uzun ömürlü bir registry
      # kimlik bilgisi durmak zorunda kalırdı. Deploy zaten sabitlenmiş bir
      # SSH kanalına sahip — ikinci bir güven ilişkisi kurmanın gerekçesi
      # yok.
      - name: İmajı derle (linux/amd64)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64
          push: false
          tags: ${{ steps.meta.outputs.image }}
          outputs: type=docker,dest=${{ runner.temp }}/zabuno-image.tar
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # Derlenen varlıklar KENDİ commit'lerini taşımalı (`docs/142`).
          # Bu argüman olmadan `public/build/revision.txt` boş kalır ve
          # "PHP güncel, varlıklar bayat" durumu dışarıdan görünmez olur —
          # 2026-09-08'de tam olarak bu oldu ve hiçbir kapı görmedi.
          build-args: |
            ZABUNO_RELEASE_SHA=${{ steps.meta.outputs.sha }}

      - name: SSH anahtarını yükle
        run: |
          install -m 700 -d ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          # Host anahtarı SABİTLENİR. `StrictHostKeyChecking=no`, ilk
          # bağlantıda ortadaki adama kapı açar; deploy kanalı üretim
          # sunucusuna kök erişimdir.
          echo "${{ secrets.DEPLOY_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      # Dizin `install.sh` ile AYNI olmalı. İlk hâli `~/zabuno`'ydu ve
      # `DEPLOY_USER=root` olduğu için `/root/zabuno`'ya bakıyordu; kurulum
      # ise `/opt/zabuno`'ya yapılıyordu. Deploy boş bir dizinde çalışırdı.
      - name: Compose dosyalarını gönder
        env:
          DEPLOY_DIR: ${{ secrets.DEPLOY_DIR || '/opt/zabuno' }}
          DEPLOY_TARGET: ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}
          # SSH her sunucuda 22'de DEĞİL. Sertleştirilmiş kurulumlarda port
          # taşınır ve akış bunu geçirmezse 22'ye bağlanıp zaman aşımına
          # düşer. Varsayılan 22, çünkü çoğu kurulum öyle; taşınmışsa
          # `DEPLOY_PORT` secret'ı söyler.
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT || '22' }}
        run: |
          # `docker/` alt dizini şart: taban compose `./docker/Caddyfile`
          # bağlıyor. İlk hâl iki dosyayı da düz kopyalıyordu, Caddyfile
          # kökte kalıyordu ve bağlama noktası bir DİZİN olarak yaratılıyordu.
          ssh -i ~/.ssh/id_ed25519 -p "$DEPLOY_PORT" "$DEPLOY_TARGET" "mkdir -p $DEPLOY_DIR/docker"

          # Yıldız bilinçli: sunucu hangi topolojiyi seçerse seçsin, o
          # dosya orada olmalı. Yalnız taban gönderilseydi, override
          # deploy anında yok olur ve site 502'ye düşerdi.
          scp -i ~/.ssh/id_ed25519 -P "$DEPLOY_PORT" docker-compose*.yml "$DEPLOY_TARGET:$DEPLOY_DIR/"
          # Compose'un `./docker/...` ile bağladığı HER dosya burada
          # olmalı; eksik kalan dosyanın yerinde Docker boş bir DİZİN
          # yaratır. `clamd.conf` tarayıcı daemon'unun yapılandırmasıdır
          # (DEPLOY-MALWARE-SCAN-12).
          scp -i ~/.ssh/id_ed25519 -P "$DEPLOY_PORT" docker/Caddyfile docker/clamd.conf "$DEPLOY_TARGET:$DEPLOY_DIR/docker/"

      # İmaj, dosya olarak DEĞİL akış olarak gider: runner'da sıkıştırılır,
      # sunucuda açılıp doğrudan `docker load`'a verilir. Diske hiç yazılmaz,
      # dolayısıyla sunucuda temizlenecek bir artık kalmaz ve deploy yarıda
      # kalırsa yarım bir tar dosyası bırakmaz.
      #
      # `gzip -1`: katmanlar tar içinde SIKIŞTIRILMAMIŞ durur, bu yüzden en
      # hızlı seviye bile aktarımı kabaca üçte birine indirir. Daha yüksek
      # seviye, kazandığından fazlasını CPU'da harcar.
      - name: İmajı SSH ile aktar
        env:
          DEPLOY_TARGET: ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT || '22' }}
          IMAGE_TAR: ${{ runner.temp }}/zabuno-image.tar
        run: |
          ls -lh "$IMAGE_TAR"

          gzip -1 -c "$IMAGE_TAR" \
            | ssh -i ~/.ssh/id_ed25519 -p "$DEPLOY_PORT" "$DEPLOY_TARGET" \
              'gunzip | docker load'

      - name: Yeni imajı yayına al
        env:
          DEPLOY_DIR: ${{ secrets.DEPLOY_DIR || '/opt/zabuno' }}
          DEPLOY_TARGET: ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}
          # SSH her sunucuda 22'de DEĞİL. Sertleştirilmiş kurulumlarda port
          # taşınır ve akış bunu geçirmezse 22'ye bağlanıp zaman aşımına
          # düşer. Varsayılan 22, çünkü çoğu kurulum öyle; taşınmışsa
          # `DEPLOY_PORT` secret'ı söyler.
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT || '22' }}
          ZABUNO_IMAGE: ${{ steps.meta.outputs.image }}
          # `github.sha` DEĞİL. `workflow_run` bağlamında o, dalın o anki
          # ucudur — deploy edilen commit değil. İkisi ayrıştığında imaj bir
          # commit'ten gelir ve etiket başka bir commit'i söyler.
          #
          # ÖLÇÜLDÜ (2026-09-08, koşum 34179388196): `c1414278` derlenip
          # yayına alındı, ama `github.sha` o an `c59d499b` olduğu için canlı
          # uygulama on iki dakika boyunca `c59d499b` çalıştırdığını SÖYLEDİ.
          # Sahibi sayfayı yeniledi, hiçbir şey değişmemişti, ve sürüm
          # etiketi ona "en güncelsin" diyordu.
          ZABUNO_BUILD_REVISION: ${{ steps.meta.outputs.sha }}
        run: |
          ssh -i ~/.ssh/id_ed25519 -p "$DEPLOY_PORT" "$DEPLOY_TARGET" \
            bash -s -- "$DEPLOY_DIR" "$ZABUNO_IMAGE" "$ZABUNO_BUILD_REVISION" <<'REMOTE'
          set -euo pipefail
          cd "$1"

          echo "ZABUNO_IMAGE=$2" > .image.env

          # Sayfanın hangi commit'i sunduğu, sayfanın KENDİSİNDEN okunabilmeli
          # (`docs/87`). İmaj etiketi sunucuda duruyor ama tarayıcıya inmiyor;
          # bu satır olmadan üretimde build kimliği boş kalıyordu.
          echo "ZABUNO_BUILD_REVISION=$3" >> .image.env

          # Topolojiyi SUNUCU seçer, akış değil. Hangi override'ın geçerli
          # olduğu makinenin kendi `.env`'inde `COMPOSE_FILE` ile yazılıdır:
          # biri yığının Caddy'sini kullanır, diğeri sunucuda hazır duran
          # bir vekilin arkasına girer. Akışa gömülseydi, ikinci bir
          # kurulum akışı çatallamak zorunda kalırdı.
          compose_file="$(sed -n 's/^COMPOSE_FILE=//p' .env | tail -n 1)"
          if [ -n "$compose_file" ]; then
              export COMPOSE_FILE="$compose_file"
          fi

          # `pull` YOK: imaj bir onceki adimda SSH ile yuklendi ve yerel.
          # Cagrilsaydi, var olmayan bir registry'de aranir ve deploy tam da
          # imaj hazirken basarisiz olurdu.
          docker compose --env-file .env --env-file .image.env up -d --remove-orphans

          # Yalniz SAHIPSIZ katmanlar silinir. Onceki SHA etiketleri
          # sunucuda KALIR ve geri alma bunlarla yapilir: `.image.env`
          # icindeki etiketi eskisiyle degistirip `up -d` yeter. Registry
          # artik geri alma kaynagi olmadigi icin bu etiketler tek
          # geriye donus yolu; toptan silen bir temizlik yazilmamali.
          docker image prune -f
          REMOTE

      - name: Sağlık kontrolü
        run: |
          # Deploy, konteyner ayağa kalktığında değil, uygulama cevap
          # verdiğinde bitmiştir. Aksi hâlde yeşil bir iş, düşmüş bir site
          # anlamına gelebilir.
          for attempt in $(seq 1 20); do
            if curl -fsS --max-time 10 "${{ secrets.DEPLOY_HEALTH_URL }}" > /dev/null; then
              echo "Sağlık kontrolü GEÇTİ (deneme ${attempt})"
              exit 0
            fi
            sleep 6
          done
          echo "Sağlık kontrolü 120 saniyede geçmedi."
          exit 1

      # DAĞITIM NE DAĞITTIĞINI KANITLAR — `docs/142`.
      #
      # Yukarıdaki sağlık kontrolü yalnız "bir şey cevap veriyor mu?" diye
      # sorar; ESKİ SÜRÜM DE CEVAP VERİR. 2026-09-08'de dağıtım her adımı —
      # sağlık kontrolü dâhil — yeşil tamamladı ve canlı site birleştirilen
      # commit'i çalıştırmıyordu. Sahibi saatlerce "ben mi yanlış yaptım"
      # diye baktı, çünkü yeşil bir dağıtım ona güncel olduğunu söylüyordu.
      #
      # Bu adım o boşluğu kapatır: yayına alınan commit ile CANLI
      # UYGULAMANIN söylediği commit karşılaştırılır, ve varlıkların
      # derlendiği commit AYRICA karşılaştırılır — çünkü ikisi ayrışabilir
      # ve bugünkü arıza tam olarak oydu.
      - name: Dağıtım ne dağıttı?
        env:
          # Yeni bir secret İSTENMEZ. İsteseydi, kurulumu bugün çalışan
          # makinede kapı sessizce kapalı kalırdı — kapının hiç var olmadığı
          # hâlin aynısı, ama var sanıldığı için daha kötüsü.
          DEPLOY_HEALTH_URL: ${{ secrets.DEPLOY_HEALTH_URL }}
          EXPECTED_SHA: ${{ steps.meta.outputs.sha }}
          BRANCH_TIP_SHA: ${{ github.sha }}
        run: |
          set -uo pipefail

          # Sağlık adresinden yalnız kök adres alınır, yol atılır.
          origin="$(printf '%s' "$DEPLOY_HEALTH_URL" | sed -E 's#^(https?://[^/]+).*#\1#')"
          if [ -z "$origin" ]; then
            echo "Sağlık adresi okunamadı; dağıtımın ne dağıttığı KANITLANAMADI."
            exit 1
          fi

          # ADRES HİÇBİR YERE BASILMAZ. GitHub yalnız secret'ın KENDİ
          # değerini maskeler; ondan türetilmiş bir parça maskelenmez.
          short() {
            if [ -z "$1" ]; then printf 'BİLİNMİYOR'; else printf '%s' "$(echo "$1" | cut -c1-8)"; fi
          }

          running=""
          assets=""

          # Konteyner değişimi bir an sürer ve vekil o aralıkta hâlâ eski
          # konteynere bağlı olabilir. Uyuşana kadar beklenir; beklemeden
          # kırmızı vermek, gerçek bir arıza ile bir saniyelik geçişi aynı
          # şey sayardı ve kapı güvenilmez olurdu.
          for attempt in $(seq 1 15); do
            proof="$(curl -fsS --max-time 15 "${origin}/up/build" 2>/dev/null || true)"

            if [ -n "$proof" ]; then
              running="$(printf '%s' "$proof" | jq -r '.revision // ""')"
              assets="$(printf '%s' "$proof" | jq -r '.assets_revision // ""')"

              if [ "$running" = "$EXPECTED_SHA" ] && [ "$assets" = "$EXPECTED_SHA" ]; then
                break
              fi
            fi

            sleep 6
          done

          {
            echo "### Canlı sitede şu an ne çalışıyor?"
            echo
            echo "| | commit |"
            echo "| --- | --- |"
            echo "| Yayına alınan | \`$(short "$EXPECTED_SHA")\` |"
            echo "| Canlı uygulama | \`$(short "$running")\` |"
            echo "| Canlı varlıklar (CSS/JS) | \`$(short "$assets")\` |"
          } >> "$GITHUB_STEP_SUMMARY"

          failed=0

          if [ "$running" != "$EXPECTED_SHA" ]; then
            echo "::error::Yayına alınan commit $(short "$EXPECTED_SHA") ama canlı uygulama $(short "$running") çalıştırıyor."
            failed=1
          fi

          # VARLIKLAR AYRI SORULUR. PHP güncel olup derlenmiş CSS/JS bayat
          # kalabilir; 2026-09-08'de canlı site yeni sayfaları sunarken
          # daisyUI'den önceki 126.594 baytlık CSS'i veriyordu.
          if [ "$assets" != "$EXPECTED_SHA" ]; then
            echo "::error::Derlenmiş varlıklar $(short "$assets") commit'inden; beklenen $(short "$EXPECTED_SHA")."
            failed=1
          fi

          if [ "$failed" -ne 0 ]; then
            echo "Dağıtım tamamlandı ama YAYINA ALDIĞI ŞEY DEĞİL. Bakılacak yer: docs/142."
            exit 1
          fi

          echo "Kanıtlandı: canlı uygulama ve varlıklar $(short "$EXPECTED_SHA") commit'inden."

          # ESKİ BİR COMMIT'İN BAŞARILI DAĞITIMI "SİTE GÜNCEL" DEMEK DEĞİL.
          #
          # `workflow_run` her CI koşumu için ayrı tetiklenir; yeni bir
          # commit main'e girdikten SONRA eski bir commit'in CI'ı bitebilir
          # ve onun dağıtımı yeşil tamamlanır. 2026-09-08 02:16'da tam
          # olarak bu oldu. Bu bir arıza DEĞİL — daha yeni bir dağıtım
          # zaten yolda — ama sessiz kalırsa sahibi yeşili "birleştirdiğim
          # şey yayında" diye okur. Kırmızı değil, söylenmiş olur.
          if [ -n "$BRANCH_TIP_SHA" ] && [ "$BRANCH_TIP_SHA" != "$EXPECTED_SHA" ]; then
            echo "::warning::Bu dağıtım $(short "$EXPECTED_SHA") commit'ini yayına aldı, ama main'in ucu $(short "$BRANCH_TIP_SHA"). Site HENÜZ en son birleşmeyi çalıştırmıyor; onun dağıtımı kendi CI'ı bitince koşacak."
            {
              echo
              echo "> Bu koşum **main'in ucunu değil**, \`$(short "$EXPECTED_SHA")\` commit'ini yayına aldı."
              echo "> En son birleşme (\`$(short "$BRANCH_TIP_SHA")\`) kendi CI'ı bitince ayrı bir dağıtımla gelecek."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

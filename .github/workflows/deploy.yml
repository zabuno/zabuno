name: Server audit read-only

# ⚠️ BU DAL ASLA BİRLEŞTİRİLMEZ (`codex/server-readonly-audit`).
#
# Dosya yolu bilerek `deploy.yml`'dir. GitHub, `workflow_dispatch`'i yalnız
# VARSAYILAN DALDA TANIMLI bir iş akışı için sunar; seçilen dalda ise O DALIN
# dosyasını çalıştırır. Yeni bir `audit.yml` varsayılan dalda bulunmadığı için
# hiç listelenmezdi. Bu yüzden denetim, var olan `deploy.yml` yolunu kullanır ve
# YALNIZ BU DALDA dağıtım tanımının yerine salt-okunur denetim tanımını koyar.
# `main` üzerindeki `deploy.yml` DEĞİŞMEZ; oradaki dağıtım aynen sürer.
#
# Bu tanımda dağıtım işi YOKTUR: `push`/`workflow_run` tetikleyicisi yok, imaj
# derlemesi yok, `docker compose up` yok, sunucuya yazma yok. Sunucuda yalnız
# `scripts/server-readonly-audit.sh` sabit, salt-okunur komutları çalıştırır.
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Salt-okunur denetimi çalıştırmak için READ_ONLY_AUDIT yazın'
        required: true
        default: ''

# Yazma yetkisi YOK. `actions: read` bile gerekmiyor: bu iş akışı başka bir
# koşumun sonucunu sormaz.
permissions:
  contents: read

concurrency:
  group: server-readonly-audit
  cancel-in-progress: false

jobs:
  audit:
    name: Salt-okunur sunucu denetimi
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # ÇİFT KİLİT: tanım yalnız bu dalda yaşar, ÜSTELİK iş yalnız bu ref'te
    # koşar. Dosya kazara başka bir dala taşınsa bile iş çalışmaz.
    if: >-
      github.ref == 'refs/heads/codex/server-readonly-audit' &&
      github.event_name == 'workflow_dispatch' &&
      inputs.confirm == 'READ_ONLY_AUDIT'
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          # Runner'da Git kimlik bilgisi bırakma: bu iş hiçbir şey itmez.
          persist-credentials: false

      - name: Denetim betiği beklenen hâlde mi?
        run: |
          set -euo pipefail
          test -f scripts/server-readonly-audit.sh
          bash -n scripts/server-readonly-audit.sh
          # Yazma yapan bir komut sızmışsa burada durur. Yorumlar ayıklanır:
          # betiğin sözleşme yorumu bu komutları BİLEREK adıyla anar.
          code="$(grep -v '^[[:space:]]*#' scripts/server-readonly-audit.sh)"
          if printf '%s\n' "$code" | grep -Eq \
              'docker[[:space:]]+(run|start|stop|restart|rm|cp|build|pull)|compose[[:space:]]+(up|down|restart)|--dbname|set[[:space:]]+-x'; then
            echo "::error::Denetim betiği yasakli bir komut iceriyor."
            exit 1
          fi
          # Tek izinli yönlendirme /dev/null'dur: betik sunucuda dosya yazmaz.
          if printf '%s\n' "$code" | grep -E '>[^&]' | grep -qv '/dev/null'; then
            echo "::error::Denetim betiginde /dev/null disi bir yonlendirme var."
            exit 1
          fi
          sha256sum scripts/server-readonly-audit.sh

      - name: SSH kimliğini hazırla
        env:
          # Secret'lar YALNIZ ortam değişkeni olarak geçer; hiçbir secret
          # ifadesi run betiğinin metnine gömülmez.
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          # Sağlama: anahtar/known_hosts boş mu? İçerik BASILMAZ.
          test -s ~/.ssh/id_ed25519
          test -s ~/.ssh/known_hosts

      - name: Sunucuyu salt-okunur denetle
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT || '22' }}
          DEPLOY_DIR: ${{ secrets.DEPLOY_DIR || '/opt/zabuno' }}
        run: |
          set -euo pipefail
          # `set -x` BİLEREK YOK: komut satırı günlüğe düşmemeli.

          if [ -z "${DEPLOY_HOST}" ] || [ -z "${DEPLOY_USER}" ]; then
            echo "::error::DEPLOY_HOST/DEPLOY_USER secret'ları tanımlı değil."
            exit 1
          fi
          # Doğrulama: kabuk enjeksiyonuna yer bırakmayan dar karakter kümesi.
          case "${DEPLOY_HOST}" in
            *[!A-Za-z0-9.:-]*) echo "::error::DEPLOY_HOST biçimi kabul edilmedi."; exit 1 ;;
          esac
          case "${DEPLOY_USER}" in
            *[!A-Za-z0-9._-]*) echo "::error::DEPLOY_USER biçimi kabul edilmedi."; exit 1 ;;
          esac
          case "${DEPLOY_PORT}" in
            ''|*[!0-9]*) echo "::error::DEPLOY_PORT sayısal değil."; exit 1 ;;
          esac
          case "${DEPLOY_DIR}" in
            /*) : ;;
            *) echo "::error::DEPLOY_DIR mutlak yol değil."; exit 1 ;;
          esac
          case "${DEPLOY_DIR}" in
            *[!A-Za-z0-9._/-]*) echo "::error::DEPLOY_DIR biçimi kabul edilmedi."; exit 1 ;;
          esac

          # Host anahtarı SABİTLENMİŞTİR: bilinmeyen sunucuya bağlanmayı
          # reddeder (`StrictHostKeyChecking=yes` + salt-okunur known_hosts).
          # `BatchMode=yes`: parola sorgusu yok, sessizce asılı kalma yok.
          ssh -i ~/.ssh/id_ed25519 \
              -p "${DEPLOY_PORT}" \
              -o BatchMode=yes \
              -o StrictHostKeyChecking=yes \
              -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
              -o ConnectTimeout=15 \
              -o ServerAliveInterval=15 \
              -o ServerAliveCountMax=4 \
              -o LogLevel=ERROR \
              "${DEPLOY_USER}@${DEPLOY_HOST}" \
              "bash -s -- '${DEPLOY_DIR}'" \
              < scripts/server-readonly-audit.sh \
              | tee "${RUNNER_TEMP}/audit.txt"

      - name: Denetim özeti
        if: always()
        run: |
          set -euo pipefail
          if [ ! -s "${RUNNER_TEMP}/audit.txt" ]; then
            echo "Denetim çıktısı yok (bağlantı kurulamadı olabilir)." >> "${GITHUB_STEP_SUMMARY}"
            exit 0
          fi
          {
            echo "## Salt-okunur sunucu denetimi"
            echo
            echo '```'
            head -c 60000 "${RUNNER_TEMP}/audit.txt"
            echo '```'
          } >> "${GITHUB_STEP_SUMMARY}"

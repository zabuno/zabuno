# Zabuno — netcup VPS üretim yığını (AMD EPYC, linux/amd64).
#
# Üç servis, üç sorumluluk. Tek konteynere sıkıştırmak ilk gün kolay,
# ilk sorunda pahalıdır: veritabanı, uygulamanın yeniden başlamasından
# etkilenmemeli ve sertifika yenilemesi uygulama deploy'una bağlı olmamalı.

services:
    db:
        image: postgres:17-alpine
        restart: unless-stopped
        environment:
            POSTGRES_DB: ${DB_DATABASE:?DB_DATABASE gerekli}
            POSTGRES_USER: ${DB_USERNAME:?DB_USERNAME gerekli}
            POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD gerekli}
            # Türkçe sıralama ve büyük/küçük harf davranışı için.
            LANG: C.UTF-8
        volumes:
            - db-data:/var/lib/postgresql/data
            # Yedek dizini hacimde: yedek, konteynerle birlikte silinmemeli.
            - db-backups:/backups
        healthcheck:
            test: ['CMD-SHELL', 'pg_isready -U ${DB_USERNAME}']
            interval: 10s
            timeout: 5s
            retries: 5
        # Veritabanı dışarıya AÇILMAZ. Yalnız uygulama ağından erişilir;
        # bir portu internete açmak, parolayı tek savunma hattı yapar.
        networks: [internal]

    app:
        image: ${ZABUNO_IMAGE:?ZABUNO_IMAGE gerekli}
        restart: unless-stopped
        depends_on:
            db:
                condition: service_healthy
            # `service_started`, `service_healthy` DEĞİL: daemon imzaları
            # yüklerken bir iki dakika sağlıksız görünür ve uygulama onu
            # beklemek zorunda değil — tarayıcı yokken yükleme zaten
            # fail-closed tutulur (`docs/76`). Sitenin açılması, virüs
            # tarayıcının hazır olmasına bağlanmamalı.
            clamav:
                condition: service_started
        environment:
            APP_ENV: production
            APP_DEBUG: 'false'
            APP_KEY: ${APP_KEY:?APP_KEY gerekli}
            APP_URL: ${APP_URL:?APP_URL gerekli}
            DB_CONNECTION: pgsql
            DB_HOST: db
            DB_PORT: '5432'
            DB_DATABASE: ${DB_DATABASE}
            DB_USERNAME: ${DB_USERNAME}
            DB_PASSWORD: ${DB_PASSWORD}

            # URL politikası konteynere GEÇMELİ. Geçmediğinde ikinci alan
            # adı 400 döner: güvenilir host listesi boş kalır, uygulama
            # `APP_URL` host'una düşer ve diğer her host'u reddeder. Bu
            # yerelde tüm yığın çalıştırılırken bulundu — birim testleri
            # yakalayamazdı, çünkü sorun kodda değil aktarımdaydı.
            URL_TRUSTED_HOSTS: ${URL_TRUSTED_HOSTS:-}
            # Kanonik host BOŞ bırakılır: bu bir SaaS, her alan adı kendi
            # adreslerini yayar ve biri diğerine yönlendirilmez.
            URL_ENFORCE_HOST: ${URL_ENFORCE_HOST:-false}
            URL_ENFORCE_SCHEME: ${URL_ENFORCE_SCHEME:-true}
            URL_CANONICAL_SCHEME: ${URL_CANONICAL_SCHEME:-https}
            # HANGİ COMMIT ÇALIŞIYOR — `docs/87`.
            #
            # Bu değer geçmediğinde üretim sayfası boş bir build kimliği
            # basıyordu: "baktığım şey gerçekten yazdığım kod mu" sorusu,
            # `preview-truth` kapısının cevaplamak için var olduğu soru,
            # canlıda cevapsız kalıyordu. Geri alma da kördü — eski bir SHA
            # etiketine dönüldüğünde sayfada hangisinin canlı olduğunu
            # söyleyen hiçbir şey yoktu.
            ZABUNO_BUILD_REVISION: ${ZABUNO_BUILD_REVISION:-}
            LOG_CHANNEL: stderr
            SESSION_DRIVER: database
            CACHE_STORE: database
            QUEUE_CONNECTION: database

            # VİRÜS TARAYICI konteynere GEÇMELİ — DEPLOY-MALWARE-SCAN-12.
            #
            # 2026-09-05'e kadar bu satırlar yoktu ve sürücü `unavailable`
            # kalıyordu: yüklenen hiçbir fotoğraf işlenmiyor, hiçbir PDF
            # açılmıyordu. Ürün dürüsttü — dosyayı tutup sebebini yazıyordu
            # — ama sahip menüsüne fotoğraf koyamıyordu. Tarama isteğin
            # içinde senkron koşar; tarayıcı bu konteynerden çağrılabilir
            # olmak zorunda. İkili, imajdaki ince istemcinin sarmalayıcısı
            # (`docker/zabuno-scan`); daemon ayrı `clamav` servisindedir.
            #
            # Varsayılan AÇIK: kapatmak sunucunun `.env`'inde bilinçli bir
            # karar olsun, unutulmuş bir satır değil. Zaman aşımı adaptörün
            # 10 saniyelik varsayılanından yüksek: 50 MB'lık bir dosya önce
            # sokete akıtılır, sonra taranır.
            MEDIA_SCANNER_DRIVER: ${MEDIA_SCANNER_DRIVER:-clamav}
            MEDIA_SCANNER_CLAMAV_BINARY_PATH: ${MEDIA_SCANNER_CLAMAV_BINARY_PATH:-/usr/local/bin/zabuno-scan}
            MEDIA_SCANNER_CLAMAV_TIMEOUT_SECONDS: ${MEDIA_SCANNER_CLAMAV_TIMEOUT_SECONDS:-30}

            # POSTA KANALI konteynere GEÇMELİ — `docs/93` (P0-06).
            #
            # `.env` üretimde konteynerin İÇİNDE yaşamaz; değerler yalnız
            # buradan gelir ve giriş betiği `config:cache`'i o değerler
            # enjekte edildikten SONRA çalıştırır. Bu satırlar olmadan
            # sunucunun `.env`'i doğru doldurulsa bile uygulama `log`
            # sürücüsüne düşer: iletişim mesajı KAYDEDİLİR ama kimseye
            # ULAŞMAZ. Arıza kodda değil aktarımdadır; birim testleri
            # göremez, `DEPLOY-MAIL-TRANSPORT-08` bekçiler.
            #
            # GİZLİ DEĞER BURADA YOK. Her satır sunucunun kendi `.env`'ine
            # başvurur (`--env-file .env`); Mailgun anahtarı depoya asla
            # yazılmaz. Sürücü ayarlanana kadar varsayılan `log`'tur:
            # yapılandırılmamış bir deploy çökmez, sadece göndermez.
            MAIL_MAILER: ${MAIL_MAILER:-log}
            MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS:-noreply@example.invalid}
            MAIL_FROM_NAME: ${MAIL_FROM_NAME:-Zabuno}
            MAILGUN_DOMAIN: ${MAILGUN_DOMAIN:-}
            MAILGUN_SECRET: ${MAILGUN_SECRET:-}
            MAILGUN_ENDPOINT: ${MAILGUN_ENDPOINT:-api.mailgun.net}
            # İletişim formu bildirimi kime gider — boşsa gönderim yok, bu
            # bir hata değil (`docs/93`).
            CONTACT_NOTIFICATION_ADDRESS: ${CONTACT_NOTIFICATION_ADDRESS:-}
        volumes:
            # Yüklenen medya imajın içinde yaşamaz; imaj değişince kaybolurdu.
            - app-storage:/var/www/html/storage/app
        networks: [internal, web]

    clamav:
        # VİRÜS TARAYICI DAEMON'U — DEPLOY-MALWARE-SCAN-12.
        #
        # Ayrı bir servis, çünkü imza veritabanı bellekte yaşar (yaklaşık
        # 1,2 GB) ve günde bir kez yenilenir. Uygulama imajına gömülseydi
        # her deploy daemon'u yeniden başlatır ve imzaları yeniden yüklerdi;
        # ayrıca uygulama konteyneri "sıfır süreç durumu" ilkesini
        # kaybederdi. Uygulama yalnız ince istemciyi taşır ve dosyayı
        # buraya soketten akıtır (`docker/zabuno-scan`).
        #
        # Sürüm SABİT (`stable` değil): imza formatı ya da sürüm atlaması
        # uygulamanın haberi olmadan gelmesin. Resmî imaj freshclam'i de
        # çalıştırır; ayrı bir cron gerekmez.
        image: clamav/clamav:1.4
        restart: unless-stopped
        volumes:
            # Varsayılan `StreamMaxLength`/`MaxFileSize` 25 MB'dir; uygulama
            # 50 MB kabul eder. Deploy bu dosyayı `docker/` altına gönderir.
            - ./docker/clamd.conf:/etc/clamav/clamd.conf:ro
            # İmzalar kalıcı: her yeniden başlatmada 250 MB indirmek,
            # freshclam hız sınırına takılmanın en hızlı yoludur.
            - clamav-db:/var/lib/clamav
        # Hiçbir port yayımlanmaz. `internal` uygulamayla konuşmak için,
        # `web` imza güncellemesi için: `internal: true` ağın interneti yok.
        networks: [internal, web]

    proxy:
        image: caddy:2-alpine
        restart: unless-stopped
        depends_on: [app]
        ports:
            - '80:80'
            - '443:443'
        environment:
            ZABUNO_DOMAINS: ${ZABUNO_DOMAINS:?ZABUNO_DOMAINS gerekli}
        volumes:
            - ./docker/Caddyfile:/etc/caddy/Caddyfile:ro
            # Sertifikalar kalıcı: her yeniden başlatmada yeniden almak,
            # Let's Encrypt hız sınırına takılmanın en hızlı yoludur.
            - caddy-data:/data
            - caddy-config:/config
        networks: [web]

volumes:
    db-data:
    db-backups:
    app-storage:
    clamav-db:
    caddy-data:
    caddy-config:

networks:
    # Veritabanı yalnız burada; internete çıkışı yok.
    internal:
        internal: true
    web:

# clamdscan İSTEMCİ yapılandırması — uygulama imajının içine kopyalanır
# (`/etc/clamav/zabuno-clamd.conf`) ve `docker/zabuno-scan` onu kullanır.
#
# Daemon bu konteynerde değil, compose'daki `clamav` servisinde çalışır;
# adres servis adıdır. Yerel soket satırı BİLİNÇLİ olarak yok: olsaydı
# istemci önce onu dener ve her çağrıda hata verirdi.

TCPSocket 3310
TCPAddr clamav

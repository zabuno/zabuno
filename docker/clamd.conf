# ClamAV daemon yapılandırması — `clamav` servisi (docker-compose.yml).
#
# Bu dosya resmî imajın kendi `clamd.conf`'unun ÜSTÜNE salt-okunur
# bağlanır. Var olma sebebi iki varsayılan: ClamAV 25 MB'ın üstündeki bir
# akışı HATA ile keser (dosya "tarayıcı çalışmıyor" diye tutulur) ve 25
# MB'ın üstündeki bir dosyayı TARAMADAN geçirir (dosya "temiz" sayılır).
# Uygulama 50 MB kabul eder; iki sınır da onun üstünde olmalı. Kapı:
# `tests/Feature/Deployment/MalwareScanTransportTest.php`.

LogTime yes

# Yerel soket imajın kendi sağlık kontrolü için kalır; uygulama TCP'den
# gelir. `TCPAddr` yazılmaz: konteynerin her arayüzünü dinler, dışarıya
# hiçbir port yayımlanmadığı için erişim yalnız compose ağlarından olur.
LocalSocket /tmp/clamd.sock
TCPSocket 3310
User clamav

# Uygulamanın kabul ettiği gövde 52M (`docker/Dockerfile` post_max_size).
StreamMaxLength 60M
MaxFileSize 60M
MaxScanSize 200M

# Günlük imza yenilemesinde eski ve yeni veritabanı aynı anda bellekte
# DURMAZ. Açık olsaydı tepe bellek yaklaşık iki katına çıkardı; bir VPS'te
# bu "çalışır" ile "OOM ile ölür" arasındaki farktır. Yenileme birkaç
# saniye sürer ve o sırada gelen tarama hata alır; uygulama zaten
# fail-closed'dır, dosya tutulur ve sonraki yüklemede taranır.
ConcurrentDatabaseReload no

server {
    listen 8080;
    server_name _;
    root /var/www/html/public;

    index index.php;
    charset utf-8;

    # Sunucu sürümünü ilan etmemek: saldırgana bedava bilgi vermez.
    server_tokens off;

    # Yükleme sınırı PHP tarafıyla tutarlı olmalı; aksi hâlde nginx 413
    # döner ve uygulama kendi hata mesajını hiç gösteremez.
    client_max_body_size 32m;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    # Derlenmiş varlıklar içerik özetli adlara sahip; uzun önbellek güvenli.
    location /build/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location ~ \.php$ {
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        include fastcgi_params;

        fastcgi_read_timeout 60s;
    }

    # `public` altındaki gizli dosyalar servis edilmez.
    location ~ /\.(?!well-known).* {
        deny all;
    }
}

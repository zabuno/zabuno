server {
    listen 8080;
    server_name _;
    root /var/www/html/public;

    index index.php;
    charset utf-8;

    # Sunucu sürümünü ilan etmemek: saldırgana bedava bilgi vermez.
    server_tokens off;

    # Zincirdeki her halka aynı sınırı taşımalı: Caddy → nginx → PHP →
    # uygulama. Biri diğerinden düşükse istek o halkada, uygulamanın hiç
    # göremeyeceği bir yerde ölür. 52m = PHP `post_max_size` ile aynı.
    client_max_body_size 52m;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # `favicon.ico` GERÇEK bir statik dosya (`public/favicon.ico`); gürültüyü
    # kesmek için günlüğü kapalı.
    location = /favicon.ico { access_log off; log_not_found off; }

    # `robots.txt` BURADA DEĞİL, uygulamada üretilir (`ShowRobotsController`).
    #
    # Laravel'in nginx şablonundan gelen `location = /robots.txt` satırı bu
    # isteği statik dosya olarak arıyordu; `public/robots.txt` olmadığı için
    # 404 dönüyor ve istek Laravel'e HİÇ ULAŞMIYORDU. Yerelde `artisan serve`
    # çalıştığı ve nginx devrede olmadığı için rota yerelde çalışıyor,
    # üretimde ölü kalıyordu — yani yalnız canlıda görünen bir kusurdu
    # (`docs/87`).
    #
    # Satır kaldırıldı: istek yukarıdaki `try_files` ile `index.php`'ye düşer.

    # Derlenmiş varlıklar içerik özetli adlara sahip; uzun önbellek güvenli.
    location /build/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location ~ \.php$ {
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        include fastcgi_params;

        fastcgi_read_timeout 60s;
    }

    # `public` altındaki gizli dosyalar servis edilmez.
    location ~ /\.(?!well-known).* {
        deny all;
    }
}

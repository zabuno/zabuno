[supervisord]
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid

[program:php-fpm]
command=php-fpm --nodaemonize --fpm-config /usr/local/etc/php-fpm.conf
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:nginx]
command=nginx -g "daemon off;"
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; ZAMANLAYICI (`routes/console.php`, HOST-QUEUE-04, `docs/98` FF-75).
; `schedule:work` dakikada bir planlanan işleri koşar; bunlardan biri
; `queue:work --stop-when-empty`: toplu AI sayfa okumaları ve çöp temizliği
; böylece canlıda da yürür. Ayrı kalıcı worker yok — kuyruk boşalınca
; süreç biter, birikmez. 2026-09-04'e kadar bu süreç YOKTU: kuyruğa giren
; hiçbir iş canlıda çalışmazdı.
[program:scheduler]
command=php /var/www/html/artisan schedule:work
directory=/var/www/html
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
